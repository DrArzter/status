name: Check

# The local ladder remains one command. CI runs its independent shards in
# parallel, then keeps one stable required check for branch protection and for
# the Deploy workflow's `workflow_run` gate — both of which name `check`, so
# that job keeps its name whatever happens around it.

on:
  pull_request:
  push:
    branches: [main]

# The gate main is protected by. It needs no credentials and can create nothing.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the static shard
        run: scripts/check.sh static

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the test shard
        run: scripts/check.sh tests

  bundle:
    name: Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the bundle shard
        run: scripts/check.sh bundle

  # The one required check. It exists so branch protection and the deploy gate
  # have a single name to wait for, and it fails if any shard did — including a
  # shard that never ran, which `always()` is what makes visible.
  check:
    if: always()
    needs: [static, tests, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate the shard results
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
        run: |
          failed=0
          for pair in "static:${STATIC_RESULT}" "tests:${TESTS_RESULT}" "bundle:${BUNDLE_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "${result}" == "success" ]]; then
              echo "ok  ${name}"
            else
              echo "FAIL ${name} (${result})"
              failed=1
            fi
          done
          exit "${failed}"
