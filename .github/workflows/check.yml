name: Check

on:
  pull_request:
  push:
    branches: [main]

# The gate main is protected by. It needs no credentials and can create nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate production Worker bundle
        run: |
          node scripts/render-wrangler-config.mjs .wrangler.test.jsonc
          npx wrangler deploy --dry-run --config .wrangler.test.jsonc --outdir dist
        env:
          D1_DATABASE_ID: 00000000-0000-4000-8000-000000000000
